<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sip & Bloom | Menu</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= NAVIGATION ================= -->

    <nav>

        <a href="index.html" class="logo-link">
            <img src="images/logo.jpeg" alt="Sip & Bloom Logo" class="logo">
        </a>

        <div class="nav-links">
            <a href="index.html">HOME</a>
            <a href="menu.html">MENU</a>
            <a href="about.html">ABOUT</a>
        </div>

        <a href="menu.html" class="nav-button">
            ORDER NOW
        </a>

    </nav>


    <!-- ================= MENU ================= -->

    <section class="menu">

        <h1>Our Menu</h1>

        <p class="menu-subtitle">
            Something delicious for every mood.
        </p>


        <div class="menu-container">


            <!-- AMERICANO -->

            <div class="menu-card">

                <img src="images/americano.jpg" alt="Americano">

                <h2>Americano</h2>

                <p>
                    Rich espresso blended with hot water.
                </p>

                <h3>₹200</h3>

                <button onclick="orderCoffee('Americano')">
                    Order Now
                </button>

            </div>


            <!-- CAPPUCCINO -->

            <div class="menu-card">

                <img src="images/cappuccino.jpg" alt="Cappuccino">

                <h2>Cappuccino</h2>

                <p>
                    Smooth espresso with steamed milk.
                </p>

                <h3>₹200</h3>

                <button onclick="orderCoffee('Cappuccino')">
                    Order Now
                </button>

            </div>


            <!-- LATTE -->

            <div class="menu-card">

                <img src="images/latte.jpg" alt="Latte">

                <h2>Latte</h2>

                <p>
                    Silky milk blended with rich espresso.
                </p>

                <h3>₹220</h3>

                <button onclick="orderCoffee('Latte')">
                    Order Now
                </button>

            </div>

        </div>

    </section>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            © 2024 SIP & BLOOM | Sip. Relax. Bloom. 
        </p>

    </footer>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
